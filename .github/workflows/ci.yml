name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
          - name: Windows x64
            os: windows-latest
          - name: Ubuntu x64
            os: ubuntu-24.04
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja and X11 headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja
      - run: just build
      - run: ./build/screencap --help || test $? -eq 64
        shell: bash
